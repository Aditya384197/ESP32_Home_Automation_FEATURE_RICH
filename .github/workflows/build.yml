name: Download Android 16 Music App Code

on:
  workflow_dispatch: # इससे आप जब चाहें बटन दबाकर इस प्रोसेस को शुरू कर सकते हैं

jobs:
  download-and-zip:
    runs-on: ubuntu-latest

    steps:
    # स्टेप 1: गिट इंस्टॉल करना और कोड क्लोन करना
    - name: Clone AOSP Music Repository
      run: |
        git clone https://googlesource.com -b main --depth=1 android-16-music-app
        # नोट: अगर आपको कोई खास टैग चाहिए तो 'main' की जगह 'android-16.0.0_r1' जैसा टैग लिख सकते हैं

    # स्टेप 2: पूरे कोड को ज़िप फ़ाइल में बदलना
    - name: Zip the Source Code
      run: |
        zip -r music_app_source.zip android-16-music-app/

    # स्टेप 3: ज़िप फ़ाइल को GitHub Artifact्स में अपलोड करना (ताकि आप डाउनलोड कर सकें)
    - name: Upload Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-16-music-source-code
        path: music_app_source.zip
        retention-days: 5 # यह फ़ाइल 5 दिनों तक डाउनलोड के लिए उपलब्ध रहेगी
