name: Build ESP32 Smart Home

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: smart-home-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32 firmware (ESP-IDF v5.1.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Use a normal GitHub runner + installed ESP-IDF.
      # This avoids nesting the esp-idf-ci-action Docker container.
      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.1.2

      - name: Configure ESP32
        shell: bash
        run: |
          set -euo pipefail
          idf.py set-target esp32

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          idf.py reconfigure

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          idf.py build

      - name: Verify ESP32 image integrity
        shell: bash
        run: |
          set -euo pipefail

          test -s build/smart_home.bin
          test -s build/bootloader/bootloader.bin
          test -s build/partition_table/partition-table.bin

          echo "=== Firmware image information ==="
          python -m esptool --chip esp32 image_info build/smart_home.bin

          echo "=== Bootloader image information ==="
          python -m esptool --chip esp32 image_info build/bootloader/bootloader.bin

          echo "=== Partition table ==="
          ls -lh             build/smart_home.bin             build/bootloader/bootloader.bin             build/partition_table/partition-table.bin

      - name: Create merged flash image
        shell: bash
        run: |
          set -euo pipefail

          test -s build/bootloader/bootloader.bin
          test -s build/partition_table/partition-table.bin
          test -s build/smart_home.bin

          # esptool v4.12 merge_bin expects address/file pairs as positional
          # arguments. Run from build/ so the paths are unambiguous.
          cd build
          python -m esptool --chip esp32 merge_bin \
            -o smart_home_merged.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 smart_home.bin
          cd ..

          test -s build/smart_home_merged.bin

          # A raw merged flash image starts at flash address 0x000000.
          # Its gaps are intentionally filled with 0xFF, so it is NOT a
          # standalone ESP application image and must not be passed to
          # `esptool image_info`. The three source images were already
          # validated above; verify the merged file's expected size and
          # exact bytes at the three flash offsets instead.
          python - <<'PY'
          from pathlib import Path

          merged = Path("build/smart_home_merged.bin").read_bytes()
          boot = Path("build/bootloader/bootloader.bin").read_bytes()
          part = Path("build/partition_table/partition-table.bin").read_bytes()
          app = Path("build/smart_home.bin").read_bytes()

          def check(offset, data, name):
              end = offset + len(data)
              if end > len(merged):
                  raise SystemExit(
                      f"{name}: merged image too small: need 0x{end:x}, got 0x{len(merged):x}"
                  )
              if merged[offset:end] != data:
                  raise SystemExit(
                      f"{name}: bytes in merged image do not match source image"
                  )
              print(f"{name}: verified at 0x{offset:06x}, {len(data)} bytes")

          check(0x1000, boot, "Bootloader")
          check(0x8000, part, "Partition table")
          check(0x10000, app, "Factory application")

          # 4 MB ESP32 flash image must fit within 0x400000 bytes.
          if len(merged) > 0x400000:
              raise SystemExit(
                  f"Merged image exceeds 4 MB flash: 0x{len(merged):x} bytes"
              )

          print(f"Merged raw flash image: {len(merged)} bytes (0x{len(merged):x})")
          print("Merged image layout verification: PASS")
          PY

          echo "=== Flash layout ==="
          printf '%s\n' \
            '0x1000  build/bootloader/bootloader.bin' \
            '0x8000  build/partition_table/partition-table.bin' \
            '0x10000 build/smart_home.bin'

          echo "=== Final images ==="
          ls -lh \
            build/smart_home.bin \
            build/bootloader/bootloader.bin \
            build/partition_table/partition-table.bin \
            build/smart_home_merged.bin

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail

          rm -f SHA256SUMS.txt

          sha256sum             build/smart_home.bin             build/bootloader/bootloader.bin             build/partition_table/partition-table.bin             build/smart_home_merged.bin             > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Upload complete firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-esp-idf-v5.1.2
          path: |
            build/smart_home.bin
            build/smart_home_merged.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
            build/smart_home.elf
            SHA256SUMS.txt
          if-no-files-found: error
