name: Download Android 16 Music App Code

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  download-and-zip:
    runs-on: ubuntu-latest

    steps:
    # स्टेप 1: सटीक AOSP म्यूज़िक ऐप रिपॉजिटरी URL का उपयोग करके क्लोन करना
    - name: Clone AOSP Music Repository
      run: |
        git clone https://googlesource.com -b main --depth=1 android-16-music-app

    # स्टेप 2: पूरे कोड को ज़िप फ़ाइल (Zip File) में बदलना
    - name: Zip the Source Code
      run: |
        zip -r music_app_source.zip android-16-music-app/

    # स्टेप 3: ज़िप फ़ाइल को GitHub Artifacts में अपलोड करना
    - name: Upload Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-16-music-source-code
        path: music_app_source.zip
        retention-days: 7 
