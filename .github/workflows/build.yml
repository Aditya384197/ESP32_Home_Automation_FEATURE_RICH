name: Build ESP32 Smart Home

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: smart-home-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32 firmware (ESP-IDF v5.1.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Use a normal GitHub runner + installed ESP-IDF.
      # This avoids nesting the esp-idf-ci-action Docker container.
      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.1.2

      - name: Configure ESP32
        shell: bash
        run: |
          set -euo pipefail
          idf.py set-target esp32

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          idf.py reconfigure

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          idf.py build

      - name: Verify ESP32 image integrity
        shell: bash
        run: |
          set -euo pipefail

          test -s build/smart_home.bin
          test -s build/bootloader/bootloader.bin
          test -s build/partition_table/partition-table.bin

          echo "=== Firmware image information ==="
          python -m esptool --chip esp32 image-info build/smart_home.bin

          echo "=== Bootloader image information ==="
          python -m esptool --chip esp32 image-info build/bootloader/bootloader.bin

          echo "=== Partition table ==="
          ls -lh             build/smart_home.bin             build/bootloader/bootloader.bin             build/partition_table/partition-table.bin

      - name: Create merged flash image
        shell: bash
        run: |
          set -euo pipefail

          # flash_args contains the exact offsets generated by ESP-IDF:
          # bootloader, partition table, and factory application.
          test -s build/flash_args

          python -m esptool --chip esp32 merge-bin             -o build/smart_home_merged.bin             @build/flash_args

          test -s build/smart_home_merged.bin

          echo "=== Merged image information ==="
          python -m esptool --chip esp32 image-info build/smart_home_merged.bin

          echo "=== Flash arguments used ==="
          cat build/flash_args

          echo "=== Final images ==="
          ls -lh             build/smart_home.bin             build/bootloader/bootloader.bin             build/partition_table/partition-table.bin             build/smart_home_merged.bin

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail

          rm -f SHA256SUMS.txt

          sha256sum             build/smart_home.bin             build/bootloader/bootloader.bin             build/partition_table/partition-table.bin             build/smart_home_merged.bin             > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Upload complete firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-esp-idf-v5.1.2
          path: |
            build/smart_home.bin
            build/smart_home_merged.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
            build/smart_home.elf
            SHA256SUMS.txt
          if-no-files-found: error
