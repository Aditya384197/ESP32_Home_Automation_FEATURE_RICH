name: Build ESP32 Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32 (ESP-IDF v5.3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32
          path: .

      - name: Collect firmware binaries
        shell: bash
        run: |
          set -euo pipefail

          # The CI action builds inside Docker and may leave build/ root-owned.
          sudo chown -R "$(id -u):$(id -g)" build

          test -f build/bootloader/bootloader.bin
          test -f build/partition_table/partition-table.bin
          test -f build/smart_home.bin

          rm -rf dist
          mkdir -p dist
          install -m 0644 build/bootloader/bootloader.bin dist/bootloader.bin
          install -m 0644 build/partition_table/partition-table.bin dist/partition-table.bin
          install -m 0644 build/smart_home.bin dist/main.bin

          cat > dist/FLASH_OFFSETS.txt <<'EOF'
          ESP32 flash offsets (4 MB flash):
            0x1000  bootloader.bin
            0x8000  partition-table.bin
            0x10000 main.bin
          EOF

          ls -lh dist

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: dist/
          if-no-files-found: error
          retention-days: 14
